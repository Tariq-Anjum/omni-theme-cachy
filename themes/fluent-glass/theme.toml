# fluent-glass theme metadata.
# Palette tuned to the fluent-glass reference: deep translucent-blue
# surfaces with a light sky-blue accent. Wallpaper is generated by
# scripts/generate_fluent_wallpaper.py (original work, MIT-licensed).

[theme]
name = "Fluent Glass"
id = "fluent-glass"
version = 1
mode = "dark"

[wallpaper]
default = "wallpapers/default.png"
