# targets.toml — explicit template → destination registry for
# omni-theme-cachy. The engine renders exactly what is declared here and
# never infers destination paths from template filenames.
#
# Schema (validated strictly by core/targets.py):
#
#   [[template]]
#   adapter = "kde-colorscheme"          # optional, informational
#
#   [template.source]
#   path = "kde/OmniTheme.colors.tpl"    # relative to this directory;
#                                        # must exist; must end in '.tpl'.
#                                        # This path is also the logical
#                                        # template NAME used for the
#                                        # resolution order:
#                                        #   1. ~/.config/omni-theme/templates/<name>
#                                        #   2. <theme>/templates/<name>
#                                        #   3. this directory (built-in)
#
#   [template.target]
#   path = "~/.local/share/…"            # absolute or '~/…'; no '..'
#
# Unknown keys, relative destinations, '..' escapes, duplicate sources
# and duplicate targets are hard errors.
#
# Session 05: the KDE color scheme package. Omni owns the *generated
# scheme file*; applying it (plasma-apply-colorscheme) is what makes KDE
# copy values into kdeglobals — that file stays KDE-owned user state.

[[template]]
adapter = "kde-colorscheme"

[template.source]
path = "kde/OmniTheme.colors.tpl"

[template.target]
path = "~/.local/share/color-schemes/OmniTheme.colors"
